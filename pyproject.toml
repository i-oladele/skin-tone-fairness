[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skinfair"
version = "0.1.0"
description = "Evaluating skin disease classification across Fitzpatrick skin types (Fitzpatrick17k-C)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
